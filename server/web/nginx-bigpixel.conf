# /etc/nginx/sites-available/bigpixel  —  bigpixel.kr / www.bigpixel.kr 정적 사이트
#
# api.bigpixel.kr(sites-available/insam) 과 같은 박스에서 돈다. 여기는 파일만 준다.
# 443 블록은 DNS 가 선 뒤 `certbot --nginx -d bigpixel.kr -d www.bigpixel.kr` 이 덧붙인다.
# 그 전까지 80 으로만 답한다.

server {
    listen 80;
    listen [::]:80;
    server_name bigpixel.kr www.bigpixel.kr;

    root /var/www/bigpixel;
    index index.html;

    # Let's Encrypt 확인 파일. insam 과 같은 폴더를 쓴다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 문서는 자주 안 바뀐다. 하루 캐시.
    location ~* \.(html)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    gzip on;
    gzip_types text/html text/css application/javascript;
}
