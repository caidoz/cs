# /etc/nginx/sites-available/gameax  —  gameax.bigpixel.kr → 127.0.0.1:8010 (uvicorn)
#
# 화면·API·media 가 전부 한 앱에서 나오므로 경로를 나누지 않고 통째로 넘긴다.
# 443 블록은 certbot --nginx -d gameax.bigpixel.kr 이 덧붙인다.

server {
    listen 80;
    listen [::]:80;
    server_name gameax.bigpixel.kr;

    # 녹화 파일 업로드. 앱의 UPLOAD_MAX_BYTES 보다 작아도 되지만 디스크(12G 여유)를 생각해 2G.
    client_max_body_size 2g;
    client_body_timeout 300s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 생성 엔진 호출이 길 수 있다.
        proxy_connect_timeout 5s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;
        # 업로드는 통째로 받아 넘긴다.
        proxy_request_buffering on;
    }
}
