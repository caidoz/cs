<style>body{margin:0;background:#101d24;color:#f2e7cb;font:16px/1.6 system-ui,'Malgun Gothic',sans-serif}main{max-width:1450px;margin:auto;padding:32px}h1{font-size:34px}p{color:#aebfc0}a{color:#dfc38b}nav{position:sticky;top:0;background:#101d24ef;padding:16px 0;display:flex;gap:12px;z-index:1;flex-wrap:wrap}button,select{padding:10px 16px;background:#23434a;color:#f2e7cb;border:1px solid #c5a269;border-radius:8px;font:inherit}#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}article{background:#192d35;border:1px solid #36515a;border-radius:12px;overflow:hidden}img{width:100%;display:block}h2{font-size:18px;padding:0 16px}article p{font-size:13px;padding:0 16px 10px}article a{display:block}small{color:#c5a269}@media(max-width:1000px){#grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){#grid{grid-template-columns:1fr}main{padding:18px}}</style>
<main><small>CASTLE SURVIVOR · NATIVE BUILD · 2026.11.07</small><h1>실제 게임 메뉴 적용 결과</h1><p>이미지 시안을 통째로 화면에 넣지 않고, 실제 성·아이템·캐릭터와 기존 명령을 새 레이아웃에 연결한 네이티브 실행 캡처입니다. 이미지를 클릭하면 원본을 엽니다.</p><p><a href="../index.html">기획 이미지와 비교</a> · <a href="../../../docs/CASTLE_SURVIVOR_MENU_RENEWAL_IMPLEMENTATION.md">구현·검증 보고서</a></p><nav><label>화면 비율 <select id="height"><option value="850">640 × 850 / 1:1.33</option><option value="1069">640 × 1069 / 1:1.67</option><option value="1280">640 × 1280 / 1:2</option><option value="1408">640 × 1408 / 1:2.2</option></select></label></nav><div id="grid"></div><p>리뷰용 독립 프로필을 사용했습니다. 캡처의 재화·보유량은 실제 사용자 계정의 상태가 아닙니다. 던전은 준비 화면이며, PVP는 기존 모드와 연출을 유지합니다.</p></main>
<script>
const screens=[['01-lobby.png','로비 · 모험','성·배경 유지, 전투력·창고 요약, 출정과 성 격돌'],['02-equipment.png','장비','실내 배경, 실제 장착 슬롯, 6열 아이콘·하단 합성·판매'],['06-companions.png','동료','실제 편성 슬롯·보급력, 같은 높이의 캐릭터, 목록 스크롤'],['09-stats.png','능력치','실제 전투력·능력치, 하단 저항·추가 효과 스크롤'],['10-codex.png','도감','기존 수집·필터·상세 기능과 공통 UI'],['04-castle-parts.png','성 · 전투 파츠','실제 합성 미리보기와 5종 파츠 강화'],['04-castle-facility.png','성 · 생산 시설','첫 성의 시설 1개, 실제 효과·비용·수금'],['08-castle-advanced.png','상위 성 · 시설 5개','선택 성에 따라 달라지는 시설과 다섯 번째 강화 버튼'],['03-shop.png','상점 · 추천','전체 화면 사용, 실제 상품과 구성·가격'],['03-packages.png','상점 · 패키지','미연결 상태, 하단 메뉴 터치 차단'],['05-dungeon.png','던전 · 준비 화면','잠금 상태와 콘텐츠 방향, 로비 복귀'],['11-settings.png','설정','음원·효과음·진동·알림·언어·지원 기능']];
function render(){const h=document.querySelector('#height').value,grid=document.querySelector('#grid');grid.replaceChildren();for(const [file,title,desc]of screens){const card=document.createElement('article'),link=document.createElement('a'),image=document.createElement('img'),heading=document.createElement('h2'),p=document.createElement('p');link.href=h+'/'+file;link.target='_blank';link.rel='noopener';image.src=link.href;image.alt=title;image.loading='lazy';heading.textContent=title;p.textContent=desc;link.append(image);card.append(link,heading,p);grid.append(card);}}
document.querySelector('#height').onchange=render;render();
</script></html>
