<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>메뉴 시안과 실제 화면 비교</title>
<style>body{margin:0;background:#0c252d;color:#f9e9ca;font:17px/1.6 system-ui,sans-serif}main{max-width:1350px;margin:auto;padding:24px}p{color:#c1d1cd}nav{position:sticky;top:0;background:#0c252df5;padding:12px;z-index:1}select{font:inherit;padding:8px;background:#17434a;color:#fff}section{margin:36px 0;border-top:1px solid #a88552}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}figure{margin:0}figcaption{padding:12px;text-align:center}img{display:block;width:100%;height:auto;border-radius:10px}a{color:#edc17e}@media(max-width:700px){main{padding:12px}.pair{gap:8px}h1{font-size:24px}}</style>
<main><h1>메뉴 시안 ↔ 실제 게임 화면</h1><p>왼쪽은 생성 시안, 오른쪽은 네이티브 실행 화면입니다. 배경·프레임·무대·정보 배치를 비교하기 위한 검토 페이지입니다. 기능 테스트 통과가 시안의 완전한 재현을 의미하지 않습니다.</p><nav>실행 화면 비율 <select id="height"><option value="850">640 × 850</option><option value="1069">640 × 1069</option><option value="1280">640 × 1280</option><option value="1408" selected>640 × 1408</option></select></nav><div id="pairs"></div></main>
<script>
const rows=[['로비','01-lobby.png','01-lobby.png'],['장비','02-equipment.png','02-equipment.png'],['상점','03-shop.png','03-shop.png'],['성 · 첫 성','04-castle.png','castle-01-overview.png'],['성 · 시설 5개','08-castle-advanced.png','08-castle-advanced.png'],['동료','06-companions.png','06-companions.png'],['던전','05-dungeon-proposal.png','05-dungeon.png'],['능력치 · 시안의 우측 상단','09-supporting-menus.png','09-stats.png'],['도감 · 시안의 좌측 하단','09-supporting-menus.png','10-codex.png'],['설정 · 시안의 우측 하단','09-supporting-menus.png','11-settings.png']];
function render(){let h=document.querySelector('select').value,p=document.querySelector('#pairs');p.replaceChildren();for(let [title,ref,actual] of rows){let s=document.createElement('section'),head=document.createElement('h2');head.textContent=title;s.append(head);let pair=document.createElement('div');pair.className='pair';for(let [label,path]of [['시안','images/'+ref],['실제 실행','runtime/'+h+'/'+actual]]){let f=document.createElement('figure'),c=document.createElement('figcaption'),a=document.createElement('a'),im=document.createElement('img');c.textContent=label;a.href=path;a.target='_blank';im.src=path;im.loading='lazy';im.alt=title+' '+label;a.append(im);f.append(c,a);pair.append(f)}s.append(pair);p.append(s)}}document.querySelector('select').onchange=render;render();
</script></html>
