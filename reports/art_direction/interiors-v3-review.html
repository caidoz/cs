<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Castle Survivor · 성별 전용 실내</title>
<style>body{margin:24px;background:#101e2b;color:#eef3ef;font:16px system-ui}header{position:sticky;top:0;background:#101e2bf2;padding:12px;z-index:1}h1{font-size:24px}select{font:inherit;padding:8px;background:#243b4a;color:white;border:1px solid #d5a955;margin:4px}main{display:grid;grid-template-columns:repeat(2,minmax(0,640px));gap:18px}img{width:100%;display:block}figure{margin:0}figcaption{padding:12px;color:#f1ca72}p{max-width:1000px;line-height:1.6}a{color:#a7e3eb}@media(max-width:700px){main{grid-template-columns:1fr}}</style>
<header><h1>성별 전용 실내 모듈</h1><p>공통 목재 방을 성별 전용 구조로 교체했습니다. 외벽과 같은 석재·금속·수정 소재가 실내의 기둥, 벽, 바닥으로 이어집니다. 실내 전체를 한 번에 그리고, 동료는 각 그림의 실제 바닥 위치에 배치합니다.</p><label>성 <select id="castle"></select></label><label>화면 <select id="height"><option value="850">640 × 850</option><option value="1069">640 × 1069</option><option value="1280">640 × 1280</option><option selected value="1408">640 × 1408</option></select></label><label>강화 <select id="grade"><option value="base">기본</option><option value="max">최대 강화</option></select></label><label>비교 <select id="compare"><option value="before">이전 공통 방 / 성별 전용 방</option><option value="shell">외벽 닫힘 / 실내 열림</option></select></label><p id="material"></p></header>
<main><figure><figcaption id="leftCaption"></figcaption><a id="leftLink"><img id="left"></a></figure><figure><figcaption>성별 전용 실내</figcaption><a id="rightLink"><img id="right"></a></figure></main>
<p>기본/상급 집기 세트와 6단계 재질 강화를 연결했습니다. 기존 성의 외형, 층수, 무기, 업그레이드 수치는 유지합니다. 네 가지 화면 비율의 160개 네이티브 캡처와 실내 개폐·확대·동료 20명 배치·골드 업그레이드 검사 통과. <a href="interiors-v3/verification.json">검증 기록</a> · <a href="../../Resources/res/castle_interiors_v3/generation.json">이미지 생성 스킬로 제작한 리소스의 프롬프트</a></p>
<script>const materials=['참나무 · 철제 볼트 · 보라색 천','사암 · 금장 · 붉은색 천','회색 화강암 · 은색 기둥 · 청색 천','짙은 현무암 · 청록 패널 · 금장','청색 장갑판 · 건메탈 · 황동','상아색 석재 · 청록 에나멜 · 황동','검은 현무암 · 진홍색 · 금빛 불사조','흰 대리석 · 청색 · 금장','흑요석 · 보라 수정 · 은색 금속','왕실 대리석 · 청색 · 금빛 태양'];const c=document.querySelector('#castle'),h=document.querySelector('#height'),g=document.querySelector('#grade'),m=document.querySelector('#compare');for(let i=1;i<=10;i++)c.add(new Option(i+'번째 성 · '+i+'층',i));c.value='8';function update(){const n=c.value.padStart(2,'0'),file=`castle-${n}-${g.value}-open.png`;const left=m.value==='before'?`rooms-v2/${h.value}/${file}`:`interiors-v3/${h.value}/castle-${n}-${g.value}-closed.png`;const right=`interiors-v3/${h.value}/${file}`;document.querySelector('#leftCaption').textContent=m.value==='before'?'이전 공통 방':'외벽 닫힘';document.querySelector('#material').textContent=materials[Number(c.value)-1];for(const [id,path] of [['left',left],['right',right]]){document.getElementById(id).src=path;document.getElementById(id+'Link').href=path}}for(const s of[c,h,g,m])s.onchange=update;update();</script></html>
