<h1>마지막 성: 시설별 기본 / 최대 강화</h1>
<p>성의 기존 배치 규격을 유지하고 실내를 하나의 단면으로 그립니다. 강화 시설만 해당 위치에서 교체합니다. NPC는 기존 물리 배치 배열을 사용합니다.</p>
<section><figure><figcaption>기본 상태</figcaption><img src="../../output/room-upgrades-1408/castle-10-level-0.png"></figure><figure><figcaption>시설 5개 최대 강화</figcaption><img src="../../output/room-upgrades-1408/castle-10-level-5.png"></figure><figure><figcaption>왕실 시설만 5단계</figcaption><img src="../../output/room-upgrades-1408/castle-10-only-room-5.png"></figure></section>
<h2>강화 데이터</h2><p>마지막 성에는 생산, 공방, 식당·주점, 문화, 왕실의 5개 시설이 있습니다. 각 시설의 저장 단계 0~5에 따라 외형과 기존 모델의 효과가 적용됩니다.</p>
