<aside style="padding:12px;background:#644422;color:white">?? ?? ? ??????. ??? ?? ?? ?? ??? ?????. <a href="interiors-v3-review.html">?? ?? ??</a></aside><header><h1>1~10번째 성 · 실내 개편</h1><p>성별 전체 개방 영역을 활용하고, 기존 1~10층 구성과 각 층의 역할을 유지했습니다. 가구·벽·바닥·조명을 SD 3D 톤으로 제작하고, 6단계 실내 업그레이드와 동료 배치를 연결했습니다.</p><label>성 <select id="castle"></select></label><label>화면 <select id="height"><option value="850">640 × 850 · 1:1.33</option><option value="1069">640 × 1069 · 1:1.67</option><option value="1280">640 × 1280 · 1:2</option><option selected value="1408">640 × 1408 · 1:2.2</option></select></label><label>상태 <select id="state"><option value="open">실내 열림</option><option value="closed">외벽 닫힘</option></select></label></header>
<main><figure><figcaption>기본 실내</figcaption><a id="baseLink"><img id="base"></a></figure><figure><figcaption>최대 강화 실내</figcaption><a id="maxLink"><img id="max"></a></figure></main>
<p>검증: 네 가지 화면 비율 × 10개 성 × 4개 상태, 총 160개 네이티브 캡처. 실내 개폐, 확대·축소, 동료 20명 배치 및 성 메뉴 업그레이드 검사 통과. <a href="rooms-v2/verification.json">검증 기록</a> · <a href="../../Resources/res/castle_rooms_sd_v2/generation.json">리소스 생성 프롬프트</a></p>
<script>const c=document.querySelector('#castle'),h=document.querySelector('#height'),s=document.querySelector('#state');for(let i=1;i<=10;i++)c.add(new Option(i+'번째 성 · '+i+'층',i));function update(){const n=c.value.padStart(2,'0');for(const g of ['base','max']){const p=`rooms-v2/${h.value}/castle-${n}-${g}-${s.value}.png`;document.getElementById(g).src=p;document.getElementById(g+'Link').href=p}}for(const x of[c,h,s])x.onchange=update;update();</script></html>
