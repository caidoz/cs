<!doctype html><html lang="ko"><meta charset="utf-8"><title>성 그리드 · 디버그 · 배경 수정</title><style>body{background:#102333;color:#edf5ef;font:16px system-ui;margin:24px}select{font:inherit;padding:8px;margin:8px}img{max-width:640px;width:100%;display:block}a{color:#a6dced}p{max-width:850px;line-height:1.6}</style><h1>성 그리드 · 디버그 · 배경 수정</h1><p>기존 성 모양의 연결된 그리드를 복원했습니다. 개발 빌드 왼쪽 상단의 디버그 버튼을 펼치면 배경 전환·PVP·최대 강화·적 공격을 사용할 수 있습니다. 나무는 비대칭 투명 섬으로 교체해 반전 반복을 제거했고, 원경은 화면 한 장에서 주기적으로 연결합니다. 선로와 중경의 타일 경계도 같은 정수 좌표로 맞췄습니다.</p><label>성 <select id="c"></select></label><label>화면 <select id="h"><option value="850">640 × 850</option><option selected value="1408">640 × 1408</option></select></label><img id="shot"><p><a href="scene-fixes/verification.json">검증 기록</a> · <a href="../../Resources/res/hybrid_sd3d/mid-v2-generation.json">새 배경 리소스 제작 프롬프트</a></p><script>const c=document.getElementById('c'),h=document.getElementById('h');for(let i=1;i<=10;i++)c.add(new Option(i+'번째 성',i));function show(){document.getElementById('shot').src=`scene-fixes/${h.value}/scene-${c.value.padStart(2,'0')}.png`}c.onchange=h.onchange=show;show();</script></html>
