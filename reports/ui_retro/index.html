<h1>레트로 UI · 장비 상세 성능 수정</h1>
<p>평면 색상, 얇은 픽셀 테두리. 장비 상세창 중복 렌더링 제거와 스프라이트·문자열 재사용 표 유지.</p>
<p>Win32 Debug 측정: 평균 프레임 95.2 → 45.4 ms · 스프라이트 1891 → 586. 기기별 실제 성능은 달라집니다.</p>
