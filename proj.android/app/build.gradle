import org.gradle.internal.os.OperatingSystem

apply plugin: 'com.android.application'

// 업로드 키. 저장소 밖 파일에서만 읽는다. 없으면 release 는 서명 없이 만든다.
//   %USERPROFILE%\.android-keys\cs-upload.properties
//   RELEASE_STORE_FILE=C:/Users/.../cs-upload.jks
//   RELEASE_STORE_PASSWORD=...  RELEASE_KEY_ALIAS=...  RELEASE_KEY_PASSWORD=...
def uploadKeyProps = new Properties()
def uploadKeyFile = new File(System.getProperty("user.home"), ".android-keys/cs-upload.properties")
if (uploadKeyFile.exists()) {
    uploadKeyFile.withInputStream { uploadKeyProps.load(it) }
}
def hasUploadKey = uploadKeyProps.containsKey("RELEASE_STORE_FILE") || project.hasProperty("RELEASE_STORE_FILE")
def keyProp = { String name -> project.hasProperty(name) ? project.property(name) : uploadKeyProps.getProperty(name) }

android {
    namespace "kr.bigpixel.cs"
    compileSdkVersion PROP_COMPILE_SDK_VERSION.toInteger()
    ndkVersion PROP_NDK_VERSION

    // Resources 전체는 설치 시점 에셋 팩(:assets_base)으로 나간다. 기본 모듈에는 담지 않는다.
    assetPacks = [":assets_base"]

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }

    defaultConfig {
        applicationId "kr.bigpixel.cs"
        minSdkVersion PROP_MIN_SDK_VERSION
        targetSdkVersion PROP_TARGET_SDK_VERSION
        versionCode 2
        versionName "1.0.1"

        externalNativeBuild {
            if (PROP_BUILD_TYPE == 'ndk-build') {
                ndkBuild {
                    targets 'MyGame'
                    arguments 'NDK_TOOLCHAIN_VERSION=clang'
                    arguments '-j' + Runtime.runtime.availableProcessors()

                    def module_paths = [project.file("../../cocos2d").absolutePath,
                                        project.file("../../cocos2d/cocos").absolutePath,
                                        project.file("../../cocos2d/external").absolutePath]
                    if (OperatingSystem.current().isWindows()) {
                        module_paths = module_paths.collect {it.replaceAll('\\\\', '/')}
                        arguments 'NDK_MODULE_PATH=' + module_paths.join(";")
                    }
                    else {
                        arguments 'NDK_MODULE_PATH=' + module_paths.join(':')
                    }
                }
            }
            else if (PROP_BUILD_TYPE == 'cmake') {
                cmake {
                    targets 'MyGame'
                    arguments "-DCMAKE_FIND_ROOT_PATH=", "-DANDROID_STL=c++_static", "-DANDROID_TOOLCHAIN=clang", "-DANDROID_ARM_NEON=TRUE"
                    cppFlags "-frtti -fexceptions -fsigned-char"
                }
            }
        }

        ndk {
            abiFilters = []
            abiFilters.addAll(PROP_APP_ABI.split(':').collect{it as String})
        }
    }

    sourceSets.main {
        java.srcDir "src"
        res.srcDir "res"
        manifest.srcFile "AndroidManifest.xml"
    }

    externalNativeBuild {
        if (PROP_BUILD_TYPE == 'ndk-build') {
            ndkBuild {
                path "jni/Android.mk"
            }
        }
        else if (PROP_BUILD_TYPE == 'cmake') {
            cmake {
                path "../../CMakeLists.txt"
            }
        }
    }

    signingConfigs {

       release {
            if (hasUploadKey) {
                storeFile file(keyProp("RELEASE_STORE_FILE"))
                storePassword keyProp("RELEASE_STORE_PASSWORD")
                keyAlias keyProp("RELEASE_KEY_ALIAS")
                keyPassword keyProp("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasUploadKey) {
                signingConfig signingConfigs.release
            }

            externalNativeBuild {
                ndkBuild {
                    arguments 'NDK_DEBUG=0'
                }
            }
        }

        debug {
            debuggable true
            jniDebuggable true
            renderscriptDebuggable true
            externalNativeBuild {
                ndkBuild {
                    arguments 'NDK_DEBUG=1'
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':libcocos2dx')
}
