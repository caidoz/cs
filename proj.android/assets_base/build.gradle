// Only explicitly approved runtime assets enter this install-time asset pack.
apply plugin: 'com.android.asset-pack'
assetPack {
    packName = "assets_base"
    dynamicDelivery { deliveryType = "install-time" }
}
def repo = rootProject.file("..")
def catalogFile = new File(repo, "content/runtime-assets.json")
def catalog = new groovy.json.JsonSlurper().parse(catalogFile)
def staged = layout.buildDirectory.dir("approved-runtime-assets")
def windowsPython = new File(System.getenv('LOCALAPPDATA') ?: '', 'Python/bin/python.exe')
def python = project.findProperty('assetPython') ?: (windowsPython.exists() ? windowsPython.absolutePath : 'python3')
def stageRuntimeAssets = tasks.register("stageRuntimeAssets", Exec) {
    inputs.file(catalogFile)
    inputs.file(new File(repo, "tools/assets/runtime_assets.py"))
    inputs.file(new File(repo, "Resources/manifest.tsv"))
    inputs.files(catalog.assets.collect { new File(repo, it.source) })
    inputs.files(catalog.assets.findAll { it.original_source }.collect { new File(repo, it.original_source) })
    outputs.dir(staged)
    workingDir repo
    commandLine python, new File(repo, "tools/assets/runtime_assets.py").absolutePath,
            "stage", "--output", staged.get().asFile.absolutePath, "--prune"
}
def syncResources = tasks.register("syncResourcesToAssets", Sync) {
    dependsOn(stageRuntimeAssets)
    from(staged) { exclude ".runtime-assets-state.json" }
    into(project.file("src/main/assets"))
}
tasks.configureEach { t ->
    if (!(t.name in ["stageRuntimeAssets", "syncResourcesToAssets", "clean"])) {
        t.dependsOn(syncResources)
    }
}
