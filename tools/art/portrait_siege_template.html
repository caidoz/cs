<!doctype html><meta charset="utf-8"><title>1:2.2 성 성장 샘플</title><style>body{background:#10171f;color:#eee;font:16px system-ui;margin:24px}button,input{cursor:pointer}header{position:sticky;top:0;background:#10171fee;padding:14px;z-index:1}.grid{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:15px}img{width:100%;display:block}.one{max-width:500px;margin:auto}h1{font-size:22px}p{color:#afc2cc}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}</style><header><h1>1:2.2 · 성 성장 10단계</h1><p>500 × 1100 · 동일한 성 너비 / 층수 증가 · 기존 16→34칸 형태 유지 · 하단 전면 포신 · 룰렛 및 모든 주요 HUD</p><button onclick="showAll()">전체 비교</button> <label>단계 <input type="range" min="1" max="10" value="1" oninput="showOne(this.value)"><b id="value">1</b></label><p>배치 검토용 시안입니다. 게임 실행 화면이 아닙니다. 층수 감소는 원본 모듈을 생략하여 표현하며 그림을 세로로 늘리지 않습니다.</p></header><main id="gallery" class="grid"></main><script>function showAll(){gallery.className='grid';gallery.innerHTML=Array.from({length:10},(_,i)=>`<section><h3>성 ${i+1}</h3><img src="stage-${String(i+1).padStart(2,'0')}.svg"></section>`).join('')}function showOne(n){value.textContent=n;gallery.className='one';gallery.innerHTML=`<img src="stage-${String(n).padStart(2,'0')}.svg">`}showAll()</script>
