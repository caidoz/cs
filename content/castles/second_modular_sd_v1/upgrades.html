<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>두 번째 성 · 기본형과 업그레이드</title>
<style>body{margin:24px;background:#182231;color:#eee;font:16px system-ui}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}figure{margin:0;background:#263448;padding:14px;border-radius:12px}img{width:100%;height:auto}a{color:#b9dcff}button{padding:10px 18px;margin:4px;cursor:pointer}h2{margin:4px 0}</style>
<h1>두 번째 사암성 · Lv.0~5</h1><p>붉은 지붕, 멧돼지 문양, 두 개의 방, 오른쪽을 향한 화염방사 주포 한 기. 동료 전투 발판과 오른쪽 히어로 발판은 같은 보행 높이를 사용합니다.</p>
<button onclick="show(false)">외관</button><button onclick="show(true)">두 방 내부</button><p><a href="../../../output/second-upgrades-review/stage-0-closed.png">실제 게임 기본형</a> · <a href="../../../output/second-upgrades-review/stage-5-open.png">실제 게임 내부</a> · <a href="../../../output/second-upgrades-review/castle-2-companion-deck.png">동료 전투 발판</a></p><main id="stages"></main>
<script>let opened=false;function show(value){opened=value;document.getElementById('stages').innerHTML=Array.from({length:6},(_,i)=>{const d=i?'upgrade-'+i+'/':'';const image=d+'reassembled-game-'+(opened?'open':'closed')+'.png';return `<figure><h2>Lv.${i}</h2><a href="${image}"><img src="${image}" alt="두 번째 성 ${i}단계"></a><a href="${d}parts.json">파츠 좌표</a> · <a href="${d}partition-check.txt">재조립 검증</a></figure>`}).join('')}show(false)</script></html>
