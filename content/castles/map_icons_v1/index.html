<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>성 10종 · 기본형 맵 아이콘</title>
<style>body{margin:24px;background:#101623;color:#edf4ff;font:16px system-ui}body.light{background:#f0e7d5;color:#192231}a{color:#68b7ff}button{padding:8px 14px;cursor:pointer}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}figure{margin:0;padding:14px;border:1px solid #67738966;border-radius:12px}img{display:block;width:100%;height:auto}h2{font-size:18px}#small{display:flex;flex-wrap:wrap;gap:14px;align-items:end}#small img{width:var(--small-size,96px);height:var(--small-size,96px)}.checker img{background:repeating-conic-gradient(#7d8590 0% 25%,#a5abb4 0% 50%) 50%/20px 20px}</style>
<h1>성 10종 · 업그레이드 전 기본형 아이콘</h1><p>개별 1024×1024 투명 PNG. 성의 재질·문양·무기와 바퀴를 유지한 SD 맵 표식입니다.</p>
<p><a href="castle-map-icons-1024.zip">PNG 10장 ZIP 다운로드</a> · <a href="overview-dark.png">전체 비교</a> · <a href="small-size-check.png">96px·64px 확인</a> · <a href="manifest.json">성 번호 매핑</a> · <a href="README.md">파일 안내</a></p>
<button onclick="document.body.classList.toggle('light')">밝은/어두운 배경</button> <button onclick="document.body.classList.toggle('checker')">투명 영역 확인</button>
<p>작은 표시 크기 <input type="range" min="48" max="160" value="96" oninput="document.documentElement.style.setProperty('--small-size',this.value+'px');document.getElementById('size').textContent=this.value"><span id="size">96</span>px</p><div id="small"></div><main id="icons"></main>
<script>const names=['목재 · 왕관','사암 · 멧돼지','화강암 · 교차검','현무암 · 거북','철제 · 사자','은빛 금속 · 기어','검은 대리석 · 불사조','백대리석 · 독수리','크리스탈 · 눈','태양 황궁'];document.getElementById('icons').innerHTML=names.map((name,i)=>{const id=String(i+1).padStart(2,'0'),p='png/castle-map-'+id+'.png';return `<figure><h2>${id} · ${name}</h2><a href="${p}"><img src="${p}" alt="${name} 기본형 아이콘"></a><a href="${p}" download>1024px PNG</a></figure>`}).join('');document.getElementById('small').innerHTML=names.map((name,i)=>`<img src="preview-256/castle-map-${String(i+1).padStart(2,'0')}.png" title="${i+1} · ${name}" alt="${name}">`).join('');</script></html>
