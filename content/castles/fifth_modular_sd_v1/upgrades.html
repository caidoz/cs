<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>다섯 번째 성 · 흑철 사자성</title>
<style>body{margin:24px;background:#182231;color:#eee;font:16px system-ui}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}figure{margin:0;background:#263448;padding:14px;border-radius:12px}img{width:100%;height:auto}a{color:#b9dcff}button{padding:10px 18px;margin:4px;cursor:pointer}h2{margin:4px 0}</style>
<h1>다섯 번째 성 · 흑철 사자성 · Lv.0~5</h1><p>각진 흑철 장갑, 황동 사자 문양, 파란 지붕과 단일 유도미사일. 5개의 방과 전면 동료 발판, 별도 히어로 발판을 구성했습니다.</p>
<p><a href="castle-01-05-comparison.png">첫 다섯 성의 같은 폭 비교</a> · <a href="../../../output/fifth-upgrades-review/stage-0-closed.png">실제 게임 기본형</a> · <a href="../../../output/fifth-upgrades-review/stage-5-open.png">실제 게임 내부</a> · <a href="../../../output/fifth-upgrades-review/castle-5-companion-deck.png">동료 전투 발판</a></p>
<button onclick="show(false)">외관</button><button onclick="show(true)">5개 방 내부</button><main id="stages"></main>
<script>function show(opened){document.getElementById('stages').innerHTML=Array.from({length:6},(_,i)=>{const d=i?'upgrade-'+i+'/':'';const image=d+'reassembled-game-'+(opened?'open':'closed')+'.png';return `<figure><h2>Lv.${i}</h2><a href="${image}"><img src="${image}" alt="다섯 번째 성 ${i}단계"></a><a href="${d}parts.json">파츠 좌표</a> · <a href="${d}partition-check.txt">재조립 검증</a></figure>`}).join('')}show(false)</script></html>
